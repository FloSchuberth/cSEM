on: [push, pull_request]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}

          - {os: windows-latest, r: 'release'}
          # use 4.1 to check with rtools40's older compiler
          - {os: windows-latest, r: '4.1'}

          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache-version: 2
          
      - name: Install lavaan from source (no Windows binary exists for R 4.1)
        if: matrix.config.r == '4.1'
        shell: Rscript {0}
        run: |
          have <- requireNamespace("lavaan", quietly = TRUE)
          if (!have || packageVersion("lavaan") < "0.6.20") {
            install.packages(
              "lavaan",
              type = "source",
              # lavaan's dependencies are unchanged since 0.6-15, so the copies
              # already installed as binaries are reused.
              dependencies = if (have) FALSE else NA,
              repos = "https://cloud.r-project.org"
            )
          }
          stopifnot(packageVersion("lavaan") >= "0.6.20")
          cat("lavaan", format(packageVersion("lavaan")), "\n")

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'